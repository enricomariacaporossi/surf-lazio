name: aggiorna-previsioni

on:
  schedule:
    - cron: "23 */3 * * *"   # ogni 3 ore, al minuto 17, orario UTC
  workflow_dispatch:           # avvio manuale: Actions > aggiorna-previsioni > Run workflow

permissions:
  contents: write

concurrency:
  group: aggiorna-previsioni
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Installa le librerie
        run: pip install -r scripts/requirements.txt

      - name: Scarica i dati e calcola i voti
        run: python scripts/aggiorna.py
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          # bot Telegram (facoltativo): senza questi due Secrets lo script lo salta
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salva i risultati su GitHub
        run: |
          git config user.name "surf-bot"
          git config user.email "surf-bot@users.noreply.github.com"
          git add data/
          git commit -m "Previsioni aggiornate" || exit 0
          git pull --rebase
          git push
