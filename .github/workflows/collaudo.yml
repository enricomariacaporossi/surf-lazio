name: collaudo

# Collaudo all'indietro: solo a mano (Actions > collaudo > Run workflow).
# Non ha un timer: non tocca l'aggiornamento ogni 3 ore.
on:
  workflow_dispatch:
    inputs:
      cosa:
        description: "collaudo (giornate della scuola) o osservazioni (i video)"
        type: choice
        options: [collaudo, osservazioni]
        default: collaudo

permissions:
  contents: write

concurrency:
  group: aggiorna-previsioni   # mai insieme a un aggiornamento: scrivono tutti e due in data/
  cancel-in-progress: false

jobs:
  collaudo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Installa le librerie
        run: pip install -r scripts/requirements.txt

      - name: Calcola i voti delle giornate vere
        run: python scripts/${{ inputs.cosa || 'collaudo' }}.py
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}

      - name: Salva il risultato
        run: |
          git config user.name "surf-bot"
          git config user.email "surf-bot@users.noreply.github.com"
          git add data/collaudo/ data/osservazioni_modello.csv 2>/dev/null || git add data/collaudo/
          git commit -m "Collaudo all'indietro" || exit 0
          git pull --rebase
          git push
