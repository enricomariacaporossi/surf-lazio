<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Surf Lazio</title>
  <meta name="description" content="Previsioni surf personali per Santa Severa e Fregene">
  <meta name="theme-color" content="#0F2B3C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- sfumatura usata dalle onde a meta' nel voto -->
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <linearGradient id="mezza" x1="0" x2="1" y1="0" y2="0">
        <stop offset="50%" stop-color="currentColor"/>
        <stop offset="50%" stop-color="currentColor" stop-opacity="0.18"/>
      </linearGradient>
    </defs>
  </svg>

  <header class="testata">
    <h1 class="marchio">Surf Lazio</h1>
    <nav class="scelta-spot" id="scelta-spot" aria-label="Scegli lo spot"></nav>
  </header>

  <main id="contenuto" aria-live="polite">
    <p class="caricamento">Carico le previsioni…</p>
  </main>

  <footer class="piede" id="piede"></footer>

  <script src="app.js"></script>
</body>
</html>
